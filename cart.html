
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LUXORA | Shopping Cart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1f1f1f;
            color: white;
        }

        /* HEADER */
        header {
            background: #111;
            padding: 22px 20px;
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 22px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 17px;
        }

        nav a:hover {
            color: #ccc;
        }

        /* PAGE */
        .container {
            max-width: 900px;
            margin: auto;
            padding: 45px 20px;
        }

        .page-title {
            text-align: center;
            font-size: 40px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 18px;
            margin-bottom: 40px;
        }

        /* CART */
        #cart-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .cart-item {
            background: #111;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .item-info h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .item-info p {
            color: #aaa;
        }

        .item-price {
            font-size: 20px;
            font-weight: bold;
        }

        .remove-btn {
            background: #333;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 7px;
            cursor: pointer;
        }

        .remove-btn:hover {
            background: #555;
        }

        /* EMPTY CART */
        .empty {
            text-align: center;
            background: #111;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 50px 20px;
        }

        .empty h2 {
            margin-bottom: 15px;
        }

        .empty p {
            color: #aaa;
            margin-bottom: 25px;
        }

        .shop-btn {
            display: inline-block;
            background: white;
            color: #111;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* TOTAL */
        .cart-total {
            background: #111;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 25px;
            margin-top: 25px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .checkout-btn {
            width: 100%;
            padding: 16px;
            background: white;
            color: #111;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .checkout-btn:hover {
            background: #ddd;
        }

        /* FOOTER */
        footer {
            background: #111;
            text-align: center;
            padding: 30px 15px;
            margin-top: 50px;
            color: #aaa;
        }

        /* MOBILE */
        @media (max-width: 600px) {

            .page-title {
                font-size: 32px;
            }

            .cart-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .item-price {
                font-size: 18px;
            }

            .remove-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="logo">LUXORA</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="cart.html">Cart 🛒</a>
        </nav>

    </header>


    <!-- MAIN -->
    <main class="container">

        <h1 class="page-title">Shopping Cart</h1>

        <p class="subtitle">
            Review your selected products.
        </p>


        <!-- CART ITEMS -->
        <div id="cart-items"></div>


        <!-- TOTAL -->
        <div id="cart-total" class="cart-total" style="display:none;">

            <div class="total-row">
                <span>Total</span>
                <span id="total-price">৳0</span>
            </div>

            <button class="checkout-btn" onclick="checkout()">
                Proceed to Checkout
            </button>

        </div>

    </main>


    <!-- FOOTER -->
    <footer>
        © 2026 LUXORA. All Rights Reserved.
    </footer>


    <script>

        function getCart() {

            return JSON.parse(
                localStorage.getItem("luxoraCart")
            ) || [];

        }


        function saveCart(cart) {

            localStorage.setItem(
                "luxoraCart",
                JSON.stringify(cart)
            );

        }


        function displayCart() {

            const cart = getCart();

            const cartItems =
                document.getElementById("cart-items");

            const cartTotal =
                document.getElementById("cart-total");

            const totalPrice =
                document.getElementById("total-price");


            cartItems.innerHTML = "";


            if (cart.length === 0) {

                cartItems.innerHTML = `
                    <div class="empty">

                        <h2>Your Cart is Empty 🛒</h2>

                        <p>
                            You haven't added any products yet.
                        </p>

                        <a href="shop.html" class="shop-btn">
                            Continue Shopping
                        </a>

                    </div>
                `;

                cartTotal.style.display = "none";

                return;
            }


            let total = 0;


            cart.forEach(function(item, index) {

                total += Number(item.price);


                const div =
                    document.createElement("div");

                div.className = "cart-item";


                div.innerHTML = `

                    <div class="item-info">

                        <h3>${item.name}</h3>

                        <p>${item.category || "Men's Fashion"}
                        </p>

                    </div>

                    <div class="item-price">
                        ৳${Number(item.price).toLocaleString()}
                    </div>

                    <button
                        class="remove-btn"
                        onclick="removeItem(${index})">

                        Remove

                    </button>

                `;


                cartItems.appendChild(div);

            });


            totalPrice.innerText =
                "৳" + total.toLocaleString();

            cartTotal.style.display = "block";

        }


        function removeItem(index) {

            const cart = getCart();

            cart.splice(index, 1);

            saveCart(cart);

            displayCart();

        }


        function checkout() {

            alert(
                "Checkout system will be added on Day 5."
            );

        }


        displayCart();

    </script>

</body>
</html>
